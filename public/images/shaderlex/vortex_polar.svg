<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#070b11" />
  
  <g transform="translate(200, 225)">
    <!-- Cartesian side -->
    <rect x="-100" y="-100" width="200" height="200" fill="none" stroke="#253147" stroke-width="2"/>
    <path d="M -100 -50 L 100 -50 M -100 0 L 100 0 M -100 50 L 100 50 M -50 -100 L -50 100 M 0 -100 L 0 100 M 50 -100 L 50 100" fill="none" stroke="#253147" stroke-width="1"/>
    
    <line x1="-120" y1="0" x2="120" y2="0" stroke="#ff4d4d" stroke-width="3" />
    <line x1="0" y1="-120" x2="0" y2="120" stroke="#4dff4d" stroke-width="3" />
    <text x="-60" y="150" fill="#ffffff" font-family="monospace" font-size="16">Cartesian (X, Y)</text>
  </g>

  <!-- Arrow -->
  <path d="M 350 225 L 450 225" fill="none" stroke="#4da6ff" stroke-width="4" stroke-dasharray="8,4" />
  <polygon points="450,225 435,215 435,235" fill="#4da6ff" />
  
  <g transform="translate(600, 225)">
    <!-- Polar side -->
    <circle cx="0" cy="0" r="100" fill="none" stroke="#253147" stroke-width="2"/>
    <circle cx="0" cy="0" r="50" fill="none" stroke="#253147" stroke-width="1"/>
    
    <path d="M -100 0 L 100 0 M 0 -100 L 0 100 M -70 -70 L 70 70 M -70 70 L 70 -70" fill="none" stroke="#253147" stroke-width="1"/>
    
    <!-- Radius Vector -->
    <line x1="0" y1="0" x2="86" y2="-50" stroke="#ff4d4d" stroke-width="3" />
    <!-- Angle Arc -->
    <path d="M 40 0 A 40 40 0 0 0 34 -20" fill="none" stroke="#4dff4d" stroke-width="3" />
    
    <text x="-60" y="150" fill="#ffffff" font-family="monospace" font-size="16">Polar (R, Theta)</text>
    <text x="50" y="-30" fill="#ff4d4d" font-family="monospace" font-size="14" font-weight="bold">R</text>
    <text x="45" y="-5" fill="#4dff4d" font-family="monospace" font-size="14" font-weight="bold">θ</text>
  </g>
</svg>
