<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#070b11" />
  
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a2333" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#grid)" />

  <g transform="translate(100, 350)">
    <!-- Axes -->
    <line x1="0" y1="0" x2="600" y2="0" stroke="#ffffff" stroke-width="2" opacity="0.5"/>
    <line x1="0" y1="0" x2="0" y2="-280" stroke="#ffffff" stroke-width="2" opacity="0.5"/>

    <!-- Labels -->
    <text x="-40" y="5" fill="#ffffff" font-family="monospace" font-size="14" opacity="0.7">0.0</text>
    <text x="610" y="5" fill="#ffffff" font-family="monospace" font-size="14" opacity="0.7">1.0 (N.L)</text>
    <text x="-40" y="-250" fill="#ffffff" font-family="monospace" font-size="14" opacity="0.7">1.0</text>

    <!-- Smooth lighting curve (linear NdotL) -->
    <line x1="0" y1="0" x2="560" y2="-250" stroke="#4da6ff" stroke-width="3" stroke-dasharray="8,6" opacity="0.5"/>
    <text x="400" y="-140" fill="#4da6ff" font-family="monospace" font-size="14" opacity="0.8" transform="rotate(-24 400 -140)">Smooth Lighting</text>

    <!-- Stepped Cel Shading curve -->
    <path d="M 0 0 L 280 0 L 280 -250 L 560 -250" fill="none" stroke="#ffff00" stroke-width="5" stroke-linejoin="round"/>
    
    <circle cx="280" cy="-250" r="6" fill="#ffff00" />
    <circle cx="280" cy="0" r="6" fill="#070b11" stroke="#ffff00" stroke-width="2" />
    
    <text x="295" y="-120" fill="#ffff00" font-family="monospace" font-size="16" font-weight="bold">Step Threshold</text>
    
    <line x1="280" y1="0" x2="280" y2="-250" stroke="#ffff00" stroke-width="2" stroke-dasharray="4,4" opacity="0.5"/>
  </g>
</svg>
