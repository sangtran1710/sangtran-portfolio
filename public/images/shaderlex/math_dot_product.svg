<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="1.5"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  
  <style>
    text { font-family: 'Kanit', sans-serif; font-weight: 700; }
    .title { font-size: 32px; fill: #F8FAFC; letter-spacing: 2px; }
    .label { font-size: 28px; fill: #94A3B8; }
    .accent { font-size: 40px; }
  </style>

  
  <rect width="800" height="450" fill="#0F172A"/>
  <rect width="800" height="450" fill="url(#grid)"/>

  
  <!-- Consistent Top Left Label -->
  <rect x="40" y="40" width="12" height="40" fill="#FF4081" />
  <text x="65" y="68" class="title">DOT PRODUCT</text>

  
  <g transform="translate(150, 350) scale(1.2)">
    <!-- Vectors -->
    
    <line x1="0" y1="0" x2="400" y2="0" stroke="#F8FAFC" stroke-width="8"/>
    <polygon points="400,0 385,-10 385,10" fill="#F8FAFC" transform="rotate(0, 400, 0)" />
  
    
    <line x1="0" y1="0" x2="200" y2="-200" stroke="#FF4081" stroke-width="8"/>
    <polygon points="200,-200 185,-210 185,-190" fill="#FF4081" transform="rotate(-45, 200, -200)" />
  
    
    <!-- Projection Line -->
    <line x1="200" y1="-200" x2="200" y2="0" stroke="#475569" stroke-width="4" stroke-dasharray="10,10"/>
    <rect x="180" y="-20" width="20" height="20" fill="none" stroke="#475569" stroke-width="4"/>
    
    <!-- Angle -->
    <path d="M 80 0 A 80 80 0 0 0 56 -56" fill="none" stroke="#F8FAFC" stroke-width="4"/>
    <text x="100" y="-30" class="accent" fill="#F8FAFC">θ</text>
    
    <!-- Projection Vector Overlap -->
    
    <line x1="0" y1="0" x2="200" y2="0" stroke="#FF4081" stroke-width="8"/>
    <polygon points="200,0 185,-10 185,10" fill="#FF4081" transform="rotate(0, 200, 0)" />
  
  </g>
</svg>